<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- TINY Researcher: Glasses, pigtails, holding a book — the studious one -->

  <!-- Body / Sweater -->
  <rect x="70" y="120" width="60" height="48" rx="10" fill="#059669" />
  <!-- Sweater pattern -->
  <line x1="75" y1="135" x2="125" y2="135" stroke="#34D399" stroke-width="1" opacity="0.4" />
  <line x1="75" y1="140" x2="125" y2="140" stroke="#34D399" stroke-width="1" opacity="0.4" />

  <!-- Arms -->
  <rect x="46" y="126" width="24" height="8" rx="4" fill="#059669" />
  <rect x="130" y="126" width="24" height="8" rx="4" fill="#059669" />

  <!-- Head -->
  <circle cx="100" cy="88" r="28" fill="#FBBF24" />

  <!-- Pigtails -->
  <circle cx="62" cy="88" r="12" fill="#92400E" />
  <circle cx="62" cy="96" r="10" fill="#92400E" />
  <circle cx="138" cy="88" r="12" fill="#92400E" />
  <circle cx="138" cy="96" r="10" fill="#92400E" />
  <!-- Hair ties -->
  <circle cx="68" cy="80" r="4" fill="#F472B6" />
  <circle cx="132" cy="80" r="4" fill="#F472B6" />
  <!-- Hair on top -->
  <path d="M 72 78 Q 80 58 100 56 Q 120 58 128 78" fill="#92400E" />
  <path d="M 74 80 Q 82 62 100 60 Q 118 62 126 80" fill="#A16207" opacity="0.3" />

  <!-- Big round glasses -->
  <circle cx="88" cy="88" r="10" fill="none" stroke="#374151" stroke-width="2.5" />
  <circle cx="112" cy="88" r="10" fill="none" stroke="#374151" stroke-width="2.5" />
  <line x1="98" y1="88" x2="102" y2="88" stroke="#374151" stroke-width="2" />
  <!-- Glass glare -->
  <path d="M 82 84 Q 84 82 87 83" stroke="white" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M 106 84 Q 108 82 111 83" stroke="white" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Eyes behind glasses -->
  <circle cx="88" cy="89" r="3.5" fill="#1C1917" />
  <circle cx="112" cy="89" r="3.5" fill="#1C1917" />
  <circle cx="89.2" cy="87.5" r="1.5" fill="white" />
  <circle cx="113.2" cy="87.5" r="1.5" fill="white" />

  <!-- Curious smile -->
  <path d="M 93 103 Q 100 108 107 103" stroke="#1C1917" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Book in left hand -->
  <rect x="24" y="120" width="28" height="22" rx="2" fill="#7C3AED" transform="rotate(-10 38 131)" />
  <line x1="38" y1="118" x2="38" y2="142" stroke="#6D28D9" stroke-width="2" transform="rotate(-10 38 130)" />
  <!-- Book pages -->
  <rect x="28" y="122" width="22" height="18" rx="1" fill="#EDE9FE" transform="rotate(-10 39 131)" />
  <!-- Book text lines -->
  <line x1="32" y1="127" x2="46" y2="127" stroke="#A78BFA" stroke-width="1" transform="rotate(-10 39 127)" opacity="0.5" />
  <line x1="32" y1="131" x2="44" y2="131" stroke="#A78BFA" stroke-width="1" transform="rotate(-10 38 131)" opacity="0.5" />
  <line x1="32" y1="135" x2="42" y2="135" stroke="#A78BFA" stroke-width="1" transform="rotate(-10 37 135)" opacity="0.5" />

  <!-- Legs -->
  <rect x="80" y="166" width="12" height="18" rx="5" fill="#047857" />
  <rect x="108" y="166" width="12" height="18" rx="5" fill="#047857" />

  <!-- Shoes -->
  <ellipse cx="86" cy="186" rx="9" ry="5" fill="#064E3B" />
  <ellipse cx="114" cy="186" rx="9" ry="5" fill="#064E3B" />
</svg>