<!DOCTYPE html>
<html>
<head>
  <title>TINY Mascots — The Guys</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1C1917;
      color: #FDE68A;
      padding: 2rem;
      margin: 0;
    }
    h1 { text-align: center; margin-bottom: 2rem; font-size: 2rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      text-align: center;
      background: #292524;
      border-radius: 12px;
      padding: 1.5rem 1rem;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.05); }
    .card img { width: 150px; height: 150px; }
    .card h3 { margin: 0.75rem 0 0.25rem; font-size: 1rem; }
    .card p { font-size: 0.75rem; color: #A8A29E; margin: 0; }
  </style>
</head>
<body>
  <h1>The Guys</h1>
  <div class="grid">
    <div class="card">
      <img src="architect.svg" alt="Architect">
      <h3>TINY Architect</h3>
      <p>The builder</p>
    </div>
    <div class="card">
      <img src="designer.svg" alt="Designer">
      <h3>TINY Designer</h3>
      <p>The creative</p>
    </div>
    <div class="card">
      <img src="developer.svg" alt="Developer">
      <h3>TINY Developer</h3>
      <p>The scrappy hero</p>
    </div>
    <div class="card">
      <img src="kickstart.svg" alt="Kickstart">
      <h3>TINY Kickstart</h3>
      <p>The launcher</p>
    </div>
    <div class="card">
      <img src="orchestrator.svg" alt="Orchestrator">
      <h3>TINY Orchestrator</h3>
      <p>The conductor</p>
    </div>
    <div class="card">
      <img src="researcher.svg" alt="Researcher">
      <h3>TINY Researcher</h3>
      <p>The studious one</p>
    </div>
    <div class="card">
      <img src="qa-tester.svg" alt="QA Tester">
      <h3>TINY QA-Tester</h3>
      <p>The bug slugger</p>
    </div>
    <div class="card">
      <img src="validator.svg" alt="Validator">
      <h3>TINY Validator</h3>
      <p>The skeptic</p>
    </div>
  </div>
</body>
</html>
