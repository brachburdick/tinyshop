<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- TINY Architect: Hard hat, hammer, sturdy builder vibe -->

  <!-- Body -->
  <rect x="70" y="120" width="60" height="50" rx="10" fill="#D97706" />
  <!-- Arms -->
  <rect x="50" y="125" width="20" height="8" rx="4" fill="#D97706" />
  <rect x="130" y="125" width="25" height="8" rx="4" fill="#D97706" transform="rotate(-30 142 129)" />

  <!-- Head -->
  <circle cx="100" cy="95" r="30" fill="#FBBF24" />

  <!-- Hard Hat -->
  <ellipse cx="100" cy="72" rx="36" ry="12" fill="#F59E0B" />
  <rect x="72" y="60" width="56" height="14" rx="6" fill="#F59E0B" />
  <rect x="85" y="52" width="30" height="12" rx="4" fill="#D97706" />
  <!-- Hat brim highlight -->
  <ellipse cx="100" cy="72" rx="34" ry="10" fill="none" stroke="#FBBF24" stroke-width="1" opacity="0.4" />

  <!-- Eyes -->
  <circle cx="88" cy="92" r="4" fill="#1C1917" />
  <circle cx="112" cy="92" r="4" fill="#1C1917" />
  <!-- Eye shine -->
  <circle cx="89.5" cy="90.5" r="1.5" fill="white" />
  <circle cx="113.5" cy="90.5" r="1.5" fill="white" />

  <!-- Determined mouth -->
  <path d="M 90 106 Q 100 112 110 106" stroke="#1C1917" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Hammer in right hand -->
  <rect x="148" y="100" width="6" height="30" rx="2" fill="#78350F" transform="rotate(-30 151 115)" />
  <rect x="143" y="92" width="18" height="12" rx="3" fill="#6B7280" transform="rotate(-30 152 98)" />

  <!-- Legs -->
  <rect x="80" y="168" width="14" height="20" rx="5" fill="#92400E" />
  <rect x="106" y="168" width="14" height="20" rx="5" fill="#92400E" />

  <!-- Boots -->
  <ellipse cx="87" cy="190" rx="10" ry="5" fill="#78350F" />
  <ellipse cx="113" cy="190" rx="10" ry="5" fill="#78350F" />
</svg>