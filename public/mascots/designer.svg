<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- TINY Designer: Stylish bob haircut, creative vibe, beret -->

  <!-- Body / Smock -->
  <rect x="68" y="120" width="64" height="50" rx="12" fill="#A78BFA" />
  <!-- Paint splatter on smock -->
  <circle cx="82" cy="140" r="3" fill="#F472B6" opacity="0.7" />
  <circle cx="118" cy="148" r="2.5" fill="#34D399" opacity="0.7" />
  <circle cx="95" cy="155" r="2" fill="#FBBF24" opacity="0.7" />

  <!-- Arms -->
  <rect x="45" y="128" width="24" height="8" rx="4" fill="#A78BFA" />
  <rect x="131" y="128" width="24" height="8" rx="4" fill="#A78BFA" />

  <!-- Head -->
  <circle cx="100" cy="90" r="30" fill="#FDE68A" />

  <!-- Bob Haircut -->
  <path d="M 65 85 Q 65 55 100 52 Q 135 55 135 85 L 138 108 Q 130 112 128 100 L 128 85
           Q 128 65 100 62 Q 72 65 72 85 L 72 100 Q 70 112 62 108 Z" fill="#4C1D95" />
  <!-- Bangs -->
  <path d="M 72 80 Q 80 68 100 66 Q 120 68 128 80 L 126 78 Q 118 72 100 70 Q 82 72 74 78 Z" fill="#5B21B6" />

  <!-- Beret -->
  <ellipse cx="100" cy="60" rx="28" ry="10" fill="#7C3AED" />
  <circle cx="100" cy="50" r="5" fill="#7C3AED" />
  <ellipse cx="100" cy="60" rx="26" ry="8" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.5" />

  <!-- Eyes - big and expressive -->
  <ellipse cx="87" cy="90" rx="5" ry="5.5" fill="#1C1917" />
  <ellipse cx="113" cy="90" rx="5" ry="5.5" fill="#1C1917" />
  <!-- Eye shine -->
  <circle cx="89" cy="88" r="2" fill="white" />
  <circle cx="115" cy="88" r="2" fill="white" />

  <!-- Slight knowing smile -->
  <path d="M 90 104 Q 100 111 110 104" stroke="#1C1917" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Paintbrush in left hand -->
  <rect x="30" y="118" width="4" height="28" rx="2" fill="#78350F" transform="rotate(20 32 132)" />
  <path d="M 28 116 L 34 116 L 32 108 Z" fill="#EC4899" transform="rotate(20 31 112)" />

  <!-- Legs -->
  <rect x="80" y="168" width="12" height="18" rx="5" fill="#6D28D9" />
  <rect x="108" y="168" width="12" height="18" rx="5" fill="#6D28D9" />

  <!-- Cute shoes -->
  <ellipse cx="86" cy="188" rx="9" ry="5" fill="#4C1D95" />
  <ellipse cx="114" cy="188" rx="9" ry="5" fill="#4C1D95" />
</svg>