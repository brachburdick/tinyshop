<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- TINY Orchestrator: Top hat, monocle, mustache, bow tie — the distinguished conductor -->

  <!-- Body / Tailcoat -->
  <rect x="68" y="120" width="64" height="50" rx="10" fill="#1C1917" />
  <!-- Coat tails -->
  <path d="M 72 168 L 65 190 L 82 178" fill="#1C1917" />
  <path d="M 128 168 L 135 190 L 118 178" fill="#1C1917" />
  <!-- Vest -->
  <rect x="82" y="122" width="36" height="30" rx="4" fill="#7C2D12" />
  <!-- Vest buttons -->
  <circle cx="100" cy="132" r="2" fill="#FBBF24" />
  <circle cx="100" cy="142" r="2" fill="#FBBF24" />

  <!-- Arms -->
  <rect x="44" y="124" width="24" height="8" rx="4" fill="#1C1917" />
  <rect x="132" y="120" width="24" height="8" rx="4" fill="#1C1917" transform="rotate(-15 144 124)" />

  <!-- Head -->
  <circle cx="100" cy="88" r="28" fill="#FBBF24" />

  <!-- Top Hat -->
  <rect x="78" y="40" width="44" height="32" rx="4" fill="#1C1917" />
  <ellipse cx="100" cy="72" rx="30" ry="8" fill="#1C1917" />
  <ellipse cx="100" cy="72" rx="28" ry="6" fill="none" stroke="#374151" stroke-width="1" />
  <!-- Hat band -->
  <rect x="80" y="62" width="40" height="5" rx="1" fill="#7C2D12" />

  <!-- Monocle on right eye -->
  <circle cx="114" cy="86" r="8" fill="none" stroke="#FBBF24" stroke-width="2" />
  <line x1="122" y1="86" x2="130" y2="100" stroke="#FBBF24" stroke-width="1.5" />
  <!-- Eyes -->
  <circle cx="88" cy="86" r="3.5" fill="#1C1917" />
  <circle cx="114" cy="86" r="3.5" fill="#1C1917" />
  <circle cx="89.2" cy="84.5" r="1.5" fill="white" />
  <circle cx="115.2" cy="84.5" r="1.5" fill="white" />

  <!-- Magnificent mustache -->
  <path d="M 88 98 Q 92 102 100 98 Q 108 102 112 98" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Mustache curls -->
  <path d="M 86 98 Q 82 96 80 98" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 114 98 Q 118 96 120 98" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Pleased small mouth -->
  <path d="M 95 106 Q 100 109 105 106" stroke="#1C1917" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Bow tie -->
  <polygon points="88,120 100,126 100,118" fill="#DC2626" />
  <polygon points="112,120 100,126 100,118" fill="#DC2626" />
  <circle cx="100" cy="122" r="3" fill="#EF4444" />

  <!-- Conductor baton in right hand -->
  <line x1="150" y1="108" x2="170" y2="88" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
  <circle cx="171" cy="87" r="2" fill="white" />

  <!-- Legs -->
  <rect x="80" y="168" width="12" height="18" rx="5" fill="#1C1917" />
  <rect x="108" y="168" width="12" height="18" rx="5" fill="#1C1917" />

  <!-- Dress shoes -->
  <ellipse cx="86" cy="188" rx="9" ry="5" fill="#292524" />
  <ellipse cx="114" cy="188" rx="9" ry="5" fill="#292524" />
</svg>